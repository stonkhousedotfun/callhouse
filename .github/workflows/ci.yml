name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The Solidity jobs (build, fmt, unit + invariant, fork 4663) live in leekzor/callhouse-contracts
  # since the 2026-09-13 repo split. This repository mounts that repo at contracts/ as a git
  # submodule pinned to one commit; the js job below does not check it out (a private submodule
  # needs a read token secret), and keeper's artifact cross-check test skips without contracts/out.

  js:
    name: keeper / indexer / web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here: package.json's packageManager (pnpm@9.10.0) is the single source, and
      # action-setup fails with "Multiple versions of pnpm specified" when both are set.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: typecheck keeper
        run: pnpm --filter @callhouse/keeper typecheck
      - name: build keeper
        run: pnpm --filter @callhouse/keeper build
      - name: keeper unit tests
        run: pnpm --filter @callhouse/keeper test
      - name: typecheck indexer
        run: pnpm --filter @callhouse/indexer typecheck
      - name: indexer tests
        run: pnpm --filter @callhouse/indexer test
      - name: typecheck relay
        run: pnpm --filter @callhouse/relay typecheck
      - name: relay tests
        run: pnpm --filter @callhouse/relay test
      - name: lint web
        run: pnpm --filter @callhouse/web lint
      - name: build web
        run: pnpm --filter @callhouse/web build
      - name: web tests
        run: pnpm --filter @callhouse/web test

  copy-lint:
    name: copy-lint (compliance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: forbidden + required copy (web; the landing is linted in leekzor/callhouse-site)
        run: node scripts/copy-lint.mjs

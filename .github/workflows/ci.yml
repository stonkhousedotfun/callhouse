name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The Solidity jobs (build, fmt, unit + invariant, fork 4663) live in stonkhousedotfun/callhouse-contracts
  # since the 2026-09-13 repo split. This repository mounts that repo at contracts/ as a git
  # submodule pinned to one commit; the js job below does not check it out (a private submodule
  # needs a read token secret), and keeper's artifact cross-check test skips without contracts/out.

  js:
    name: keeper / indexer / web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # No `version:` here: package.json's packageManager (pnpm@9.10.0) is the single source, and
      # action-setup fails with "Multiple versions of pnpm specified" when both are set.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: check generated v2 service environments
        run: node ops/v2-env.mjs --check
      - name: check generated market keeper environments
        run: node ops/keeper-env.sh --check
      - name: typecheck keeper
        run: pnpm --filter @callhouse/keeper typecheck
      - name: build keeper
        run: pnpm --filter @callhouse/keeper build
      - name: keeper unit tests
        run: pnpm --filter @callhouse/keeper test
      - name: typecheck indexer
        run: pnpm --filter @callhouse/indexer typecheck
      - name: indexer tests
        run: pnpm --filter @callhouse/indexer test
      - name: typecheck relay
        run: pnpm --filter @callhouse/relay typecheck
      - name: relay tests
        run: pnpm --filter @callhouse/relay test
      - name: lint web
        run: pnpm --filter @callhouse/web lint
      - name: build web
        run: pnpm --filter @callhouse/web build
      - name: web tests
        run: pnpm --filter @callhouse/web test

  # User notifications (notifier/). Its own job so a notifier change does not wait on the web build.
  # The storage tests run on PGlite in-process: no Postgres service is needed.
  notifier:
    name: notifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: typecheck notifier
        run: pnpm --filter @callhouse/notifier typecheck
      - name: build notifier
        run: pnpm --filter @callhouse/notifier build
      - name: notifier tests
        run: pnpm --filter @callhouse/notifier test

  copy-lint:
    name: copy-lint (compliance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22}
      - name: forbidden + required copy (web; the landing is linted in stonkhousedotfun/callhouse-site)
        run: node scripts/copy-lint.mjs
